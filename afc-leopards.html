    --bg:#0e1712; --surface:#16211a; --surface-2:#1c2820;
    --text:#e9efe6; --text-muted:#9fb2a2; --text-faint:#5f7264; --border:#2a3830;
    --accent:#6fb0e8; --accent-strong:#1c1e5c;

    --topbar-bg:#8c1420;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:"Fraunces",Georgia,serif; font-weight:600; text-wrap:balance; margin:0; }
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .page{max-width:980px;margin:0 auto;padding:0 20px 64px;}

  .topbar{background:var(--topbar-bg);}
  .topbar-inner{
    max-width:980px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:64px;flex-wrap:wrap;
  }
  .topbar-nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 0;}
  .topbar-link{

    padding:4px 0;border-bottom:2px solid transparent;
  }
  .topbar-link:hover{color:var(--gold);border-bottom-color:var(--gold);}
  .topbar-center{display:flex;align-items:center;gap:9px;padding:8px 0;}
  .topbar-wordmark{color:#f4f6ee;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:0.88rem;letter-spacing:0.01em;white-space:nowrap;}
  .topbar-pill{
    font-family:"IBM Plex Mono",monospace;font-size:0.76rem;font-weight:500;
    background:rgba(244,246,238,0.12);border:1px solid rgba(244,246,238,0.28);
    color:#f4f6ee;padding:5px 11px;border-radius:999px;white-space:nowrap;
  }
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .season-select-wrap{position:relative;display:inline-flex;align-items:center;flex:none;}
  .season-select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    font-family:"IBM Plex Mono",monospace;font-size:0.74rem;font-weight:500;
    background:rgba(244,246,238,0.12);border:1px solid rgba(244,246,238,0.32);
    color:#f4f6ee;padding:6px 26px 6px 11px;border-radius:999px;
    cursor:pointer;white-space:nowrap;
  }
  .season-select:hover{border-color:var(--gold);}
  .season-select-wrap::after{
    content:"";position:absolute;right:11px;top:50%;transform:translateY(-45%);
    width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid #f4f6ee;pointer-events:none;
  }

  .masthead{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-name{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.15rem;letter-spacing:0.01em;}
  .brand-sub{font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:1px;}
  .season-pill{font-family:"IBM Plex Mono",monospace;font-size:0.78rem;font-weight:500;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:999px;}
  .masthead-right{display:flex;align-items:center;gap:14px;}
  .back-link{font-size:0.84rem;font-weight:600;color:var(--text-muted);}
  .back-link:hover{color:var(--accent);}

  .hero{
    background:linear-gradient(155deg,var(--hero-bg) 0%,var(--hero-bg-2) 100%);
    color:var(--hero-text); border-radius:20px; padding:36px 32px 30px;
    position:relative; overflow:hidden; box-shadow:var(--shadow);
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(560px 220px at 88% -10%, rgba(185,134,42,0.22), transparent 70%);
    pointer-events:none;
  }
  .hero-top{position:relative;}
  .ribbon{
    display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#20180a;
    font-weight:600;font-size:0.72rem;letter-spacing:0.09em;text-transform:uppercase;
    padding:5px 11px;border-radius:999px;
  }
  .ribbon.ribbon-alt{background:rgba(244,246,238,0.14);color:var(--hero-text);border:1px solid rgba(244,246,238,0.3);}
  .hero h1{font-size:clamp(2rem,5vw,2.8rem);color:var(--hero-text);margin-top:10px;}
  .hero-tag{color:var(--hero-muted);font-size:0.98rem;margin-top:6px;max-width:46ch;}
  .hero-record{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px;position:relative;}
  .hero-record div{display:flex;flex-direction:column;gap:2px;}
  .hero-record .num{font-family:"IBM Plex Mono",monospace;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .hero-record .lbl{font-size:0.72rem;color:var(--hero-muted);text-transform:uppercase;letter-spacing:0.08em;}

  section{margin-top:40px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .section-head h2{font-size:1.4rem;}
  .section-head p{margin:2px 0 0;color:var(--text-muted);font-size:0.88rem;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat-tile .num{font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:600;}
  .stat-tile .lbl{font-size:0.74rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}

  .scorer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .scorer-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .scorer-card.rank-1{border-color:var(--gold);background:linear-gradient(180deg, var(--gold-soft), var(--surface) 65%);}
  .scorer-rank{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:0.85rem;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-muted);flex:none;}
  .rank-1 .scorer-rank{background:var(--gold);color:#20180a;}
  .scorer-name{font-weight:600;font-size:0.92rem;}
  .scorer-bar-wrap{margin-top:4px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
  .scorer-bar{height:100%;background:var(--accent);}
  .rank-1 .scorer-bar{background:var(--gold);}
  .scorer-goals{margin-left:auto;text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600;flex:none;}
  .scorer-goals small{display:block;font-family:"Work Sans",sans-serif;font-weight:400;font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;}
  .scorer-foot{margin-top:10px;font-size:0.8rem;color:var(--text-muted);}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);padding:6px 13px;border-radius:999px;font-size:0.82rem;font-weight:500;cursor:pointer;}
  .chip[aria-pressed="true"]{background:var(--accent-strong);border-color:var(--accent-strong);color:#f4f6ee;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
  table{border-collapse:collapse;width:100%;min-width:640px;}
  thead th{text-align:left;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top;font-size:0.9rem;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr.is-hidden{display:none;}
  td.date{font-family:"IBM Plex Mono",monospace;color:var(--text-muted);white-space:nowrap;font-size:0.82rem;}
  td.venue{white-space:nowrap;color:var(--text-muted);font-size:0.82rem;}
  td.score{font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap;}
  .result-pill{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;}
  .result-pill.W{background:var(--win);} .result-pill.D{background:var(--draw);} .result-pill.L{background:var(--loss);}
  .scorer-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
  .scorer-chip{font-size:0.74rem;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .scorer-chip.unknown{border-style:dashed;font-style:italic;}
  .scorer-chip.og{opacity:0.85;}
  .match-note{font-size:0.76rem;color:var(--text-muted);margin-top:4px;max-width:32ch;}
  .row-actions{white-space:nowrap;}
  .icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:8px;padding:4px 9px;font-size:0.76rem;cursor:pointer;margin-right:4px;}
  .icon-btn:hover{color:var(--text);border-color:var(--text-muted);}

  .editor-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
  .editor-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;font-size:0.98rem;}
  .editor-toggle .arrow{transition:transform 0.15s ease;color:var(--text-muted);display:inline-block;}
  .editor-panel.open .editor-toggle .arrow{transform:rotate(90deg);}
  .editor-body{display:none;margin-top:16px;}
  .editor-panel.open .editor-body{display:block;}
  .readonly-note{font-size:0.85rem;color:var(--text-muted);background:var(--surface-2);border-radius:10px;padding:10px 14px;margin-top:12px;}

  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .form-grid .span-2{grid-column:span 2;}
  @media (max-width:640px){.form-grid{grid-template-columns:repeat(2,1fr);}.form-grid .span-2{grid-column:span 2;}}
  label{display:block;font-size:0.74rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
  input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:0.9rem;font-family:inherit;}
  .scorer-rows{margin-top:6px;display:flex;flex-direction:column;gap:8px;}
  .scorer-row{display:grid;grid-template-columns:2fr 1fr auto auto auto auto;gap:8px;align-items:center;}
  @media (max-width:640px){.scorer-row{grid-template-columns:1fr 70px auto;}}

  .scorer-row .flags label{display:inline-flex;align-items:center;gap:3px;text-transform:none;letter-spacing:0;margin:0;font-size:0.72rem;}
  .btn{border:1px solid var(--accent-strong);background:var(--accent-strong);color:#f4f6ee;padding:9px 16px;border-radius:9px;font-weight:600;font-size:0.88rem;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--text);border-color:var(--border);}
  .btn.danger{background:transparent;color:var(--loss);border-color:var(--loss);}
  .btn.ghost{background:transparent;border:none;color:var(--text-muted);text-decoration:underline;padding:6px 0;font-size:0.82rem;cursor:pointer;}
  .form-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}

  footer{margin-top:36px;text-align:center;color:var(--text-muted);font-size:0.78rem;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,20,14,0.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:50;}

  .modal-close{background:none;border:none;font-size:1.3rem;color:var(--text-muted);cursor:pointer;line-height:1;}

  .theme-toggle{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;flex:none;
    background:rgba(244,246,238,0.12);border:1px solid rgba(244,246,238,0.28);
    color:#f4f6ee;cursor:pointer;transition:border-color 0.12s ease, transform 0.12s ease;
  }
  .theme-toggle:hover{border-color:var(--gold);transform:scale(1.06);}
  .theme-toggle:active{transform:scale(0.94);}
  .theme-toggle svg{width:15px;height:15px;display:block;}
  .theme-toggle .icon-sun{display:none;}
  .theme-toggle[data-mode="dark"] .icon-moon{display:none;}
  .theme-toggle[data-mode="dark"] .icon-sun{display:block;}

  .reveal{opacity:0;transform:translateY(10px);transition:opacity 0.5s ease, transform 0.5s ease;}
  .reveal.is-visible{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
  }

  .table-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .match-search{
    flex:1 1 220px;min-width:160px;
    font-family:"Work Sans",sans-serif;font-size:0.86rem;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:999px;outline:none;
    transition:border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .match-search::placeholder{color:var(--text-muted);}
  .match-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
  thead th.sortable{cursor:pointer;user-select:none;}
  thead th.sortable:hover{color:var(--accent);}
  thead th.sortable .sort-arrow{display:inline-block;margin-left:3px;opacity:0.35;font-size:0.65rem;}
  thead th.sortable.sort-active .sort-arrow{opacity:1;color:var(--accent);}
  .no-rows{padding:24px;text-align:center;color:var(--text-muted);}

  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;}
  .chart-card .chart-foot{margin-top:10px;font-size:0.8rem;color:var(--text-muted);}
  .points-chart-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
  .points-chart-area{fill:url(#ptsGradient);opacity:0.5;}
  .points-chart-grid{stroke:var(--border);stroke-width:1;}
  .points-chart-axis-label{fill:var(--text-faint);font-size:9px;font-family:"IBM Plex Mono",monospace;}
  .points-chart-dot{fill:var(--gold);stroke:var(--surface);stroke-width:2;}
  .points-chart-dot-pulse{fill:var(--gold);opacity:0.35;animation:ptsPulse 2.2s ease-out infinite;}
  @keyframes ptsPulse{
    0%{ r:5; opacity:0.4; }
    100%{ r:13; opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .points-chart-dot-pulse{animation:none;opacity:0;}
  }
</style>

        '<div class="hero-record">' + heroRecordHTML(matches) + '</div>' +
      '</section>' +

      '<section class="reveal"><div class="section-head"><h2>Points progression</h2><p>Cumulative league points, ' + esc(meta.label) + '</p></div>' +
        pointsChartHTML(matches) +
      '</section>' +

      '<section class="reveal"><div class="section-head"><h2>Season at a glance</h2></div><div class="stat-grid">' + statGridHTML(matches) + '</div></section>' +

      '<section class="reveal"><div class="section-head"><h2>Goalscorers</h2><p>Ranked by confirmed league goals, ' + esc(meta.label) + '</p></div>' +
        '<div class="scorer-grid">' + scorers.cards + '</div>' +
        '<p class="scorer-foot">' + scorers.foot + '</p>' +
      '</section>' +

      '<section class="reveal"><div class="section-head"><h2>Match log</h2><p>' + matches.length + ' matches &middot; ' + esc(meta.label) + ' ' + esc(seasonState.competitionDefault) + '</p></div>' +
        '<div class="table-controls">' +
          '<input type="search" class="match-search" id="matchSearch" placeholder="Search opponent or competition…" value="' + esc(matchSearchQuery) + '">' +
        '</div>' +
        '<div class="filters" id="filters">' +
          '<button class="chip" data-filter-group="result" data-filter-value="all" aria-pressed="' + (activeFilters.result==='all') + '">All results</button>' +
          '<button class="chip" data-filter-group="result" data-filter-value="W" aria-pressed="' + (activeFilters.result==='W') + '">Wins</button>' +
          '<button class="chip" data-filter-group="result" data-filter-value="D" aria-pressed="' + (activeFilters.result==='D') + '">Draws</button>' +
          '<button class="chip" data-filter-group="result" data-filter-value="L" aria-pressed="' + (activeFilters.result==='L') + '">Losses</button>' +
          '<button class="chip" data-filter-group="venue" data-filter-value="Home" aria-pressed="' + (activeFilters.venue==='Home') + '">Home</button>' +
          '<button class="chip" data-filter-group="venue" data-filter-value="Away" aria-pressed="' + (activeFilters.venue==='Away') + '">Away</button>' +
        '</div>' +
        '<div class="table-wrap"><table id="matchTable"><thead><tr>' +
          sortHeaderHTML('date', 'Date') + sortHeaderHTML('venue', 'Venue') + sortHeaderHTML('opponent', 'Opponent') + sortHeaderHTML('score', 'Score') + '<th>Scorers</th><th></th>' +
        '</tr></thead>' +
        '<tbody id="matchBody">' + matchTableBodyHTML(sortMatchesForDisplay(matches), canEditRows) + '</tbody></table></div>' +
        '<p class="no-rows" id="noRowsMsg" hidden>No matches match your filters.</p>' +
      '</section>' +

      editorSection +

      '<section><div class="notes-panel">' + notesHTML(seasonState) + '</div></section>' +

      '<footer>Built as a living record &mdash; add results after each matchday to keep it current.</footer>' +
    '</div>';
  }

  function renderPageHTML(seasonState){
    var fontLink = document.getElementById('fontLink').outerHTML;
    var styleTag = document.getElementById('appStyle').outerHTML;
    var liveMeta = { key: LIVE_KEY, editable: true, label: seasonState.season, champions: !!seasonState.champions, finalPosition: seasonState.finalPosition || null };
    return '<!doctype html>\n<html lang="en">\n<head>\n' + HEAD_META +
      '<title>AFC Leopards 2025/26</title>\n' + fontLink + '\n' + styleTag +
      '\n</head>\n<body>\n<div id="pageRoot">' + pageBodyHTML(seasonState, liveMeta) + '</div>' +
      '\n<div id="modalRoot"></div>\n' +
      '<script id="season-data" type="application/json">' + JSON.stringify(seasonState) + '<' + '/script>\n' +
      '<script id="season-data-2024-25" type="application/json">' + JSON.stringify(seasonArchive2024) + '<' + '/script>\n' +
      '<script>' + SELF_SRC + '<' + '/script>\n' +
      '</body>\n</html>';
  }

  /* ---------- hydrate on load ---------- */
  function hydrate(){
    document.getElementById('pageRoot').innerHTML = pageBodyHTML(SEASONS[currentSeasonKey].state, SEASONS[currentSeasonKey]);
    applyTheme(storedTheme || 'dark');
    wireReveal();
    animateHeroCounters();
  }
  function renderSeason(key){
    if(!SEASONS[key] || key === currentSeasonKey) return;
    currentSeasonKey = key;
    activeFilters = { result: 'all', venue: 'all' };
    matchSort = { field: 'date', dir: -1 };
    matchSearchQuery = '';
    hydrate();
    applyFilters();
  }

  function applyFilters(){
    var body = document.getElementById('matchBody');
    if(!body) return;
    var q = matchSearchQuery.trim().toLowerCase();
    var visibleCount = 0;
    Array.prototype.forEach.call(body.querySelectorAll('tr[data-id]'), function(tr){
      var ok = (activeFilters.result === 'all' || tr.getAttribute('data-result') === activeFilters.result) &&
               (activeFilters.venue === 'all' || tr.getAttribute('data-venue') === activeFilters.venue) &&
               (!q || (tr.getAttribute('data-opponent')||'').indexOf(q) !== -1 || (tr.getAttribute('data-competition')||'').indexOf(q) !== -1);
      tr.classList.toggle('is-hidden', !ok);
      if(ok) visibleCount++;
    });
    var noRowsMsg = document.getElementById('noRowsMsg');
    if(noRowsMsg) noRowsMsg.hidden = visibleCount !== 0;
  }
  function renderMatchBody(){
    var meta = SEASONS[currentSeasonKey];
    var matches = sortedMatches(meta.state);
    var canEditRows = !!meta.editable && !readOnly;
    var body = document.getElementById('matchBody');
    if(!body) return;
    body.innerHTML = matchTableBodyHTML(sortMatchesForDisplay(matches), canEditRows);
    Array.prototype.forEach.call(document.querySelectorAll('#matchTable th[data-sort-field]'), function(th){
      var field = th.getAttribute('data-sort-field');
      var active = matchSort.field === field;
      th.classList.toggle('sort-active', active);
      var arrowEl = th.querySelector('.sort-arrow');
      if(arrowEl) arrowEl.innerHTML = active ? (matchSort.dir === 1 ? '&uarr;' : '&darr;') : '&udarr;';
    });
    applyFilters();
  }

  /* ---------- delegated events (survive hydration; no re-binding needed) ---------- */
  document.addEventListener('click', function(e){
    var sortTh = e.target.closest('th[data-sort-field]');
    if(sortTh){
      var field = sortTh.getAttribute('data-sort-field');
      if(matchSort.field === field){ matchSort.dir *= -1; }
      else { matchSort.field = field; matchSort.dir = (field === 'date' ? -1 : 1); }
      renderMatchBody();
      return;
    }
    var chip = e.target.closest('.chip');
    if(chip){
      var group = chip.getAttribute('data-filter-group');
      var value = chip.getAttribute('data-filter-value');
      activeFilters[group] = value;
      Array.prototype.forEach.call(document.querySelectorAll('[data-filter-group="'+group+'"]'), function(b){
        b.setAttribute('aria-pressed', String(b === chip));
      });
      applyFilters();
      return;
    }
    var themeBtn = e.target.closest('#themeToggle');
    if(themeBtn){
      var next = resolvedMode() === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(THEME_KEY, next); } catch(e2){}
      storedTheme = next;
      applyTheme(next);
      return;
    }

    var toggle = e.target.closest('#editorToggle');
    if(toggle){ document.getElementById('editorPanel').classList.toggle('open'); return; }

    if(e.target.id === 'newMatchBtn'){ openModal(null); return; }

    var actBtn = e.target.closest('[data-act]');
    if(actBtn){
      var id = actBtn.getAttribute('data-id');
      var match = season.matches.find(function(x){ return x.id === id; });
      if(!match) return;
      if(actBtn.getAttribute('data-act') === 'edit'){ openModal(match); }
      else if(actBtn.getAttribute('data-act') === 'del'){
        if(actBtn.getAttribute('data-armed') !== 'true'){
          actBtn.setAttribute('data-armed','true'); actBtn.textContent = 'Sure?';
          setTimeout(function(){ actBtn.removeAttribute('data-armed'); actBtn.textContent = 'Delete'; }, 3000);
          return;
        }
        submitChange(season.matches.filter(function(x){ return x.id !== id; }));
      }
      return;
    }
  });

  document.addEventListener('change', function(e){
    if(e.target && e.target.classList && e.target.classList.contains('season-select')){
      renderSeason(e.target.value);
    }
  });

  document.addEventListener('input', function(e){
    if(e.target && e.target.id === 'matchSearch'){
      matchSearchQuery = e.target.value;
      applyFilters();
    }
  });

  /* ---------- scroll-reveal (shared pattern across the site) ---------- */
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var revealObserver = (window.IntersectionObserver && !reduceMotion) ? new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 }) : null;
  function wireReveal(){
    var els = document.querySelectorAll('.reveal');
    Array.prototype.forEach.call(els, function(el, i){
      if(reduceMotion || !revealObserver){ el.classList.add('is-visible'); }
      else {
        el.style.transitionDelay = (Math.min(i, 6) * 60) + 'ms';
        revealObserver.observe(el);
      }
    });
  }

  /* ---------- animated hero counters ---------- */
  function animateCount(el){
    var target = parseInt(el.getAttribute('data-count'), 10);
    if(isNaN(target) || el.getAttribute('data-counted') === 'true') return;
    el.setAttribute('data-counted', 'true');
    if(reduceMotion){ el.textContent = target; return; }
    var start = null, duration = 700;
    function step(ts){
      if(start === null) start = ts;
      var progress = Math.min(1, (ts - start) / duration);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(eased * target);
      if(progress < 1) requestAnimationFrame(step);
      else el.textContent = target;
    }
    requestAnimationFrame(step);
  }
  function animateHeroCounters(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-count]'), function(el){
      el.removeAttribute('data-counted');
      animateCount(el);
    });
  }

  /* ---------- read-only ---------- */
  function enterReadOnly(reason){
    readOnly = true;
    readOnlyReason = reason || readOnlyReason;
    hydrate();
    applyFilters();
  }
  artifactApiPromise.then(function(api){
    if(!api){ enterReadOnly('unavailable'); }
  }).catch(function(){ enterReadOnly('unavailable'); });

  /* ---------- modal ---------- */
  function scorerRowHTML(sc){
    sc = sc || {};
    return '<div class="scorer-row" data-scorer-row>' +
      '<input type="text" placeholder="Scorer name" value="' + esc(sc.name||'') + '" data-f="name">' +
      '<input type="text" placeholder="Min" value="' + esc(sc.minute||'') + '" data-f="minute">' +
      '<span class="flags"><label><input type="checkbox" data-f="penalty" ' + (sc.penalty?'checked':'') + '> pen</label></span>' +
      '<span class="flags"><label><input type="checkbox" data-f="ownGoal" ' + (sc.ownGoal?'checked':'') + '> o.g.</label></span>' +
      '<span class="flags"><label><input type="checkbox" data-f="unknown" ' + (sc.unknown?'checked':'') + '> unknown</label></span>' +
      '<button type="button" class="icon-btn" data-remove-scorer>&times;</button>' +
    '</div>';
  }

  function openModal(existingMatch){
    var isEdit = !!existingMatch;
    var m = existingMatch || { date:'', venue:'Home', opponent:'', gf:0, ga:0, scorers:[], note:'', competition: season.competitionDefault };

    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">' +
        '<div class="modal-head"><h3>' + (isEdit ? 'Edit match' : 'Add a match') + '</h3><button class="modal-close" data-close type="button">&times;</button></div>' +
        '<div class="form-grid">' +
          '<div class="span-2"><label>Date</label><input type="date" id="fDate" value="' + esc(m.date) + '"></div>' +
          '<div><label>Venue</label><select id="fVenue"><option value="Home"' + (m.venue==='Home'?' selected':'') + '>Home</option><option value="Away"' + (m.venue==='Away'?' selected':'') + '>Away</option></select></div>' +
          '<div><label>Competition</label><input type="text" id="fCompetition" value="' + esc(m.competition||season.competitionDefault) + '" list="compList"><datalist id="compList"><option value="Kenyan Premier League"><option value="FKF Cup"><option value="CECAFA Kagame Cup"><option value="CAF Champions League"><option value="Friendly"></datalist></div>' +
          '<div class="span-2"><label>Opponent</label><input type="text" id="fOpponent" value="' + esc(m.opponent) + '"></div>' +
          '<div><label>AFC Leopards goals</label><input type="number" min="0" id="fGf" value="' + esc(m.gf) + '"></div>' +
          '<div><label>Opponent goals</label><input type="number" min="0" id="fGa" value="' + esc(m.ga) + '"></div>' +
        '</div>' +
        '<div style="margin-top:16px;"><label>AFC Leopards scorers</label><div class="scorer-rows" id="scorerRows">' +
          (m.scorers && m.scorers.length ? m.scorers.map(scorerRowHTML).join('') : '') +
        '</div><button type="button" class="btn ghost" id="addScorerRow">+ Add scorer</button></div>' +
        '<div style="margin-top:12px;"><label>Note (optional)</label><textarea id="fNote" rows="2" placeholder="e.g. abandoned, postponed, milestone...">' + esc(m.note||'') + '</textarea></div>' +
        '<div class="form-actions">' +
          '<button class="btn" id="saveMatchBtn" type="button">' + (isEdit ? 'Save changes' : 'Add match') + '</button>' +
          '<button class="btn secondary" data-close type="button">Cancel</button>' +
          (isEdit ? '<button class="btn danger" id="deleteMatchBtn" type="button" style="margin-left:auto;">Delete match</button>' : '') +
        '</div>' +
        '<div class="form-msg" id="formMsg"></div>' +
      '</div></div>';

    var backdrop = document.getElementById('modalBackdrop');
    function close(){ document.getElementById('modalRoot').innerHTML = ''; }
    backdrop.addEventListener('click', function(e){
      if(e.target === backdrop || e.target.closest('[data-close]')) close();
      if(e.target.matches('[data-remove-scorer]')) e.target.closest('[data-scorer-row]').remove();
      if(e.target.id === 'addScorerRow') document.getElementById('scorerRows').insertAdjacentHTML('beforeend', scorerRowHTML());
    });

    document.getElementById('saveMatchBtn').addEventListener('click', function(){
      var msg = document.getElementById('formMsg');
      var date = document.getElementById('fDate').value;
      var opponent = document.getElementById('fOpponent').value.trim();
      var venue = document.getElementById('fVenue').value;
      var competition = document.getElementById('fCompetition').value.trim() || season.competitionDefault;
      var gf = parseInt(document.getElementById('fGf').value, 10);
      var ga = parseInt(document.getElementById('fGa').value, 10);
      var note = document.getElementById('fNote').value.trim();

      if(!date || !opponent || isNaN(gf) || isNaN(ga)){
        msg.className = 'form-msg err'; msg.textContent = 'Please fill in date, opponent, and both scores.'; return;
      }
      var scorers = [];
      Array.prototype.forEach.call(document.querySelectorAll('[data-scorer-row]'), function(row){
        var name = row.querySelector('[data-f="name"]').value.trim();
        var minute = row.querySelector('[data-f="minute"]').value.trim();
        if(!name) return;
        var sc = { name: name, minute: minute || null };
        if(row.querySelector('[data-f="penalty"]').checked) sc.penalty = true;
        if(row.querySelector('[data-f="ownGoal"]').checked) sc.ownGoal = true;
        if(row.querySelector('[data-f="unknown"]').checked) sc.unknown = true;
        scorers.push(sc);
      });
      if(scorers.length !== gf){
        msg.className = 'form-msg err';
        msg.textContent = 'Heads up: ' + scorers.length + ' scorer row(s) listed but the score says ' + gf + ' AFC Leopards goal(s). Adjust and save again.';
        return;
      }

      var match = {
        id: (isEdit && m.id) ? m.id : (date + '-' + slugify(opponent) + '-' + Math.random().toString(36).slice(2,6)),
        date: date, competition: competition, venue: venue, opponent: opponent, gf: gf, ga: ga, scorers: scorers
      };
      if(note) match.note = note;

      var nextMatches;
      if(isEdit){
        nextMatches = season.matches.map(function(x){ return x.id === m.id ? match : x; });
      } else {
        nextMatches = season.matches.concat([match]);
      }
      msg.className = 'form-msg ok'; msg.textContent = 'Saving…';
      submitChange(nextMatches, msg);
    });

    if(isEdit){
      document.getElementById('deleteMatchBtn').addEventListener('click', function(){
        var btn = document.getElementById('deleteMatchBtn');
        if(btn.getAttribute('data-armed') !== 'true'){
          btn.setAttribute('data-armed','true'); btn.textContent = 'Click again to confirm'; return;
        }
        var msg = document.getElementById('formMsg');
        msg.className = 'form-msg ok'; msg.textContent = 'Deleting…';
        submitChange(season.matches.filter(function(x){ return x.id !== m.id; }), msg);
      });
    }
  }

  /* ---------- save: build a candidate season object and publish a freshly-rendered document ---------- */
  function submitChange(nextMatches, msgEl){
    var candidate = Object.assign({}, season, { matches: nextMatches, lastUpdated: new Date().toISOString().slice(0,10) });
    artifactApiPromise.then(function(api){
      if(!api){
        if(msgEl){ msgEl.className='form-msg err'; msgEl.textContent = 'Editing isn’t available in this view.'; }
        enterReadOnly('unavailable');
        return;
      }
      var html = renderPageHTML(candidate);
      api.publish(html).then(function(){
        if(msgEl){ msgEl.className='form-msg ok'; msgEl.textContent = 'Saved — refreshing…'; }
        /* the shell reloads this view to the new version automatically */
      }).catch(function(err){
        var code = err && err.code;
        if(code === 'not_writer' || code === 'not_granted'){
          if(msgEl){ msgEl.className='form-msg err'; msgEl.textContent = 'This view can’t save changes.'; }
          enterReadOnly('not_writer');
        } else if(code === 'conflict'){
          if(msgEl){ msgEl.className='form-msg ok'; msgEl.textContent = 'Someone else just updated this page — refreshing…'; }
        } else {
          if(msgEl){ msgEl.className='form-msg err'; msgEl.textContent = 'Couldn’t save: ' + ((err && err.message) || 'unknown error') + '. Try again.'; }
          window.console && console.error('Publish failed', err);
        }
      });
    });
  }

  /* ---------- theme toggle (persisted per-viewer via localStorage; this artifact's own origin) ---------- */
  var THEME_KEY = 'kpl-theme';
  var storedTheme = null;
  try { storedTheme = localStorage.getItem(THEME_KEY); } catch(e3){}
  function systemPrefersDark(){
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function resolvedMode(){
    var attr = document.documentElement.getAttribute('data-theme');
    if(attr === 'dark' || attr === 'light') return attr;
    return systemPrefersDark() ? 'dark' : 'light';
  }
  function applyTheme(stored){
    if(stored === 'light' || stored === 'dark'){
      document.documentElement.setAttribute('data-theme', stored);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    var themeToggleEl = document.getElementById('themeToggle');
    if(themeToggleEl) themeToggleEl.setAttribute('data-mode', resolvedMode());
  }

  hydrate();
  applyFilters();
})();
</script>

</body></html>
