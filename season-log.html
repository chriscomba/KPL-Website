<!doctype html>
<html lang="en">
<head></head>
<body>
<title>Season log</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="appStyle">
  :root{
    --bg:#f4f6ee;
    --surface:#ffffff;
    --surface-2:#eaeee0;
    --text:#132018;
    --text-muted:#57685a;
    --text-faint:#8b998c;
    --border:#d7ddce;
    --border-dashed:#c7cfbc;
    --accent:#1f7a4d;
    --accent-strong:#0c2f1d;
    --gold:#b9862a;
    --gold-soft:#f2e6c5;
    --ke-red:#b8182b;
    --ke-green:#0b6e3c;
    --topbar-bg:#af1626;
    --shadow: 0 1px 2px rgba(12,30,20,0.06), 0 8px 24px -12px rgba(12,30,20,0.18);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1712; --surface:#16211a; --surface-2:#1c2820;
      --text:#e9efe6; --text-muted:#9fb2a2; --text-faint:#5f7264; --border:#2a3830; --border-dashed:#33453a;
      --accent:#4fb27e; --accent-strong:#153a26;
      --gold:#e0b458; --gold-soft:#3a3018;
      --ke-red:#e2534a; --ke-green:#49b57a;
      --topbar-bg:#8c1420;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1712; --surface:#16211a; --surface-2:#1c2820;
    --text:#e9efe6; --text-muted:#9fb2a2; --text-faint:#5f7264; --border:#2a3830; --border-dashed:#33453a;
    --accent:#4fb27e; --accent-strong:#153a26;
    --gold:#e0b458; --gold-soft:#3a3018;
    --ke-red:#e2534a; --ke-green:#49b57a;
    --topbar-bg:#8c1420;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:"Fraunces",Georgia,serif; font-weight:600; text-wrap:balance; margin:0; }
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .page{max-width:760px;margin:0 auto;padding:0 20px 64px;}

  .topbar{background:var(--topbar-bg);}
  .topbar-inner{
    max-width:1000px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:64px;flex-wrap:wrap;
  }
  .topbar-nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 0;}
  .topbar-link{
    color:#f4f6ee;font-weight:700;font-size:0.98rem;letter-spacing:0.01em;
    padding:4px 0;border-bottom:2px solid transparent;
    transition:color 0.12s ease, border-color 0.12s ease;
  }
  .topbar-link:hover{color:var(--gold);border-bottom-color:var(--gold);}
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .topbar-center{display:flex;align-items:center;gap:9px;padding:8px 0;}
  .topbar-wordmark{color:#f4f6ee;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:0.88rem;letter-spacing:0.01em;white-space:nowrap;}
  .topbar-pill{
    font-family:"IBM Plex Mono",monospace;font-size:0.76rem;font-weight:500;
    background:rgba(244,246,238,0.12);border:1px solid rgba(244,246,238,0.28);
    color:#f4f6ee;padding:5px 11px;border-radius:999px;white-space:nowrap;
  }

  .theme-toggle{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;flex:none;
    background:rgba(244,246,238,0.12);border:1px solid rgba(244,246,238,0.28);
    color:#f4f6ee;cursor:pointer;transition:border-color 0.12s ease, transform 0.12s ease;
  }
  .theme-toggle:hover{border-color:var(--gold);transform:scale(1.06);}
  .theme-toggle:active{transform:scale(0.94);}
  .theme-toggle svg{width:15px;height:15px;display:block;}
  .theme-toggle .icon-sun{display:none;}
  .theme-toggle[data-mode="dark"] .icon-moon{display:none;}
  .theme-toggle[data-mode="dark"] .icon-sun{display:block;}

  .flag-strip{display:flex;height:6px;}
  .flag-strip span{flex:1;}
  .flag-strip .fs-black{background:#111;}
  .flag-strip .fs-white{flex:0 0 3px;background:#f4f6ee;}
  .flag-strip .fs-red{background:var(--ke-red);}
  .flag-strip .fs-green{background:var(--ke-green);}

  .reveal{opacity:0;transform:translateY(10px);transition:opacity 0.5s ease, transform 0.5s ease;}
  .reveal.is-visible{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
  }

  .headline{padding:40px 0 8px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
  .headline h1{font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.08;color:var(--text);}
  .headline h1 .accent{color:var(--ke-red);}
  .headline-tag{color:var(--text-muted);font-size:1rem;max-width:60ch;}
  .back-link{font-size:0.84rem;font-weight:600;color:var(--text-muted);transition:color 0.12s ease;}
  .back-link:hover{color:var(--accent);}

  section{margin-top:28px;}

  .club-status{
    background:var(--gold-soft);color:#5c4413;font-size:0.72rem;font-weight:700;
    text-transform:uppercase;letter-spacing:0.06em;padding:5px 11px;border-radius:999px;white-space:nowrap;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .club-status{color:#f2ddaa;} }
  :root[data-theme="dark"] .club-status{color:#f2ddaa;}
  .club-status.relegated{background:transparent;border:1px solid var(--ke-red);color:var(--ke-red);}

  .snapshot-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 26px 24px;box-shadow:var(--shadow);
    transition:box-shadow 0.18s ease, transform 0.18s ease;
  }
  .snapshot-top{display:flex;justify-content:flex-end;margin-bottom:18px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .stat-tile{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color 0.15s ease, transform 0.15s ease;}
  .stat-tile:hover{border-color:var(--accent);transform:translateY(-2px);}
  .stat-tile .num{font-family:"IBM Plex Mono",monospace;font-size:1.4rem;font-weight:600;}
  .stat-tile .lbl{font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .snapshot-note{margin:18px 0 0;color:var(--text-muted);font-size:0.9rem;}
  .snapshot-note a{color:var(--accent);font-weight:600;}

  .empty-pick{
    padding:48px 28px;border:1px dashed var(--border-dashed);border-radius:var(--radius);
    background:var(--surface);text-align:center;color:var(--text-muted);font-size:0.92rem;
    position:relative;overflow:hidden;
  }
  .empty-pick a{color:var(--accent);font-weight:600;}
  .empty-pick .icon-wrap{
    width:52px;height:52px;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    animation:iconBreathe 2.6s ease-in-out infinite;
  }
  .empty-pick .icon-wrap svg{width:24px;height:24px;}
  @keyframes iconBreathe{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(31,122,77,0.14); }
    50%{ transform:scale(1.06); box-shadow:0 0 0 8px rgba(31,122,77,0); }
  }
  @media (prefers-reduced-motion: reduce){
    .empty-pick .icon-wrap{animation:none;}
  }

  footer{margin-top:44px;text-align:center;color:var(--text-muted);font-size:0.78rem;}
  footer a{color:var(--accent);font-weight:600;}
</style>

<div class="topbar">
  <div class="topbar-inner">
    <nav class="topbar-nav" aria-label="Site sections">
      <a class="topbar-link" href="schedule.html">Schedule</a>
      <a class="topbar-link" href="standings.html">Standings</a>
      <a class="topbar-link" href="results.html">Results</a>
      <a class="topbar-link" href="stats.html">Stats</a>
    </nav>
    <div class="topbar-right">
      <a class="topbar-center" href="index.html" style="text-decoration:none;">
        <span class="topbar-wordmark">Kenya Premier League</span>
      </a>
      <span class="topbar-pill">2025/26 season</span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" data-mode="light">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </div>
</div>
<div class="flag-strip"><span class="fs-black"></span><span class="fs-white"></span><span class="fs-red"></span><span class="fs-white"></span><span class="fs-green"></span></div>

<div class="page">
  <a class="back-link" href="index.html" style="display:inline-block;margin-top:18px;">&larr; All clubs</a>

  <section class="headline" style="margin-top:0;">
    <h1 id="clubHeading">Kenya Premier League <span class="accent">Season log</span></h1>
    <p class="headline-tag" id="clubTag">Pick a club from the homepage to see its 2025/26 season snapshot.</p>
  </section>

  <section class="reveal" id="clubBody"></section>

  <footer>Every club&rsquo;s full final table is on the <a href="standings.html">Standings</a> page.</footer>
</div>

<script>
(function(){
  "use strict";

  var HOME_URL = "index.html";

  var CLUBS = {
    "nairobi-united": {name: "Nairobi United FC", position: 4, points: 53, record: "14–11–9", goals: 44},
    "shabana": {name: "Shabana FC", position: 5, points: 52, record: "14–10–10", goals: 35},
    "kakamega-homeboyz": {name: "Kakamega Homeboyz FC", position: 6, points: 49, record: "12–13–9", goals: 47},
    "kcb": {name: "KCB FC", position: 7, points: 48, record: "13–9–12", goals: 36},
    "muranga-seal": {name: "Murang’a SEAL FC", position: 8, points: 47, record: "13–8–13", goals: 42},
    "aps-bomet": {name: "APS Bomet FC", position: 10, points: 44, record: "11–11–12", goals: 37},
    "transmara-sugar": {name: "TransMara Sugar FC", position: 11, points: 44, record: "10–14–10", goals: 30},
    "bandari": {name: "Bandari FC", position: 12, points: 44, record: "9–17–8", goals: 26},
    "ulinzi-stars": {name: "Ulinzi Stars FC", position: 13, points: 41, record: "11–8–15", goals: 35},
    "mathare-united": {name: "Mathare United FC", position: 14, points: 41, record: "11–8–15", goals: 31},
    "posta-rangers": {name: "Posta Rangers FC", position: 15, points: 40, record: "9–13–12", goals: 31},
    "kariobangi-sharks": {name: "Kariobangi Sharks FC", position: 16, points: 38, record: "8–14–12", goals: 30},
    "bidco-united": {name: "Bidco United FC", position: 17, points: 27, record: "5–12–17", goals: 19, relegated: true},
    "sofapaka": {name: "Sofapaka FC", position: 18, points: 19, record: "3–10–21", goals: 19, relegated: true}
  };

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function ordinal(n){
    var s = ["th","st","nd","rd"], v = n % 100;
    return n + (s[(v-20)%10] || s[v] || s[0]);
  }

  function slugFromHash(){
    return decodeURIComponent((location.hash || "").replace(/^#/, ""));
  }

  function clubHTML(club){
    var statusText = ordinal(club.position) + " of 18" + (club.relegated ? " &middot; Relegated" : "");
    return ""
      + "<div class=\"snapshot-card\">"
      +   "<div class=\"snapshot-top\">"
      +     "<span class=\"club-status" + (club.relegated ? " relegated" : "") + "\">" + statusText + "</span>"
      +   "</div>"
      +   "<div class=\"stat-grid\">"
      +     "<div class=\"stat-tile\"><div class=\"num mono\">" + club.points + "</div><div class=\"lbl\">Points</div></div>"
      +     "<div class=\"stat-tile\"><div class=\"num mono\">" + club.record + "</div><div class=\"lbl\">Record</div></div>"
      +     "<div class=\"stat-tile\"><div class=\"num mono\">" + club.goals + "</div><div class=\"lbl\">Goals</div></div>"
      +   "</div>"
      +   "<p class=\"snapshot-note\">A full match-by-match season log hasn&rsquo;t been built for " + esc(club.name) + " yet &mdash; this is its final 2025/26 standings line. Ask and one gets added.</p>"
      + "</div>";
  }

  function emptyHTML(){
    return "<div class=\"empty-pick\">"
      + "<div class=\"icon-wrap\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"></path><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"></path></svg></div>"
      + "Open this page from a club&rsquo;s card on the <a href=\"" + HOME_URL + "\">homepage</a> to see that club&rsquo;s season snapshot."
      + "</div>";
  }

  /* ---------- theme toggle ---------- */
  var THEME_KEY = 'kpl-theme';
  var storedTheme = null;
  try{ storedTheme = window.localStorage.getItem(THEME_KEY); }catch(e){}
  function systemPrefersDark(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function resolvedMode(){
    var attr = document.documentElement.getAttribute('data-theme');
    if(attr === 'dark' || attr === 'light') return attr;
    return systemPrefersDark() ? 'dark' : 'light';
  }
  function applyTheme(mode){
    if(mode === 'dark' || mode === 'light'){
      document.documentElement.setAttribute('data-theme', mode);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    var btn = document.getElementById('themeToggle');
    if(btn) btn.setAttribute('data-mode', resolvedMode());
  }
  document.getElementById('themeToggle').addEventListener('click', function(){
    var next = resolvedMode() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ window.localStorage.setItem(THEME_KEY, next); }catch(err){}
  });

  /* ---------- scroll-reveal ---------- */
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function wireReveal(){
    var el = document.getElementById('clubBody');
    el.classList.remove('is-visible');
    if(reduceMotion){ el.classList.add('is-visible'); return; }
    void el.offsetWidth;
    requestAnimationFrame(function(){ el.classList.add('is-visible'); });
  }

  function render(){
    var slug = slugFromHash();
    var club = CLUBS[slug];
    var body = document.getElementById("clubBody");
    var heading = document.getElementById("clubHeading");
    var tag = document.getElementById("clubTag");
    if(club){
      heading.innerHTML = esc(club.name) + " <span class=\"accent\">Season log</span>";
      tag.textContent = "2025/26 season snapshot.";
      body.innerHTML = clubHTML(club);
      document.title = club.name + " — Season log";
    } else {
      heading.innerHTML = "Kenya Premier League <span class=\"accent\">Season log</span>";
      tag.textContent = "Pick a club from the homepage to see its 2025/26 season snapshot.";
      body.innerHTML = emptyHTML();
      document.title = "Season log";
    }
    wireReveal();
  }

  applyTheme(storedTheme || 'dark');
  window.addEventListener("hashchange", render);
  render();
})();
</script>

</body>
</html>
